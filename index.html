<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Sweet Flower Shop</title>
	<link rel="stylesheet" href="css/fonts.css">
	<link rel="stylesheet" href="css/style.css">
</head>

<body>
	<header class="main-header">
		<div class="container">
			<a class="main-header__logo" href="index.html">Our Blooms®</a>
			<nav class="main-header__menu-nav">
				<ul class="main-header__list">
					<li><a class="main-header__link" href="#">Gallery</a></li>
					<li><a class="main-header__link" href="#">About</a></li>
					<li><a class="main-header__link" href="#">Contact</a></li>
				</ul>
			</nav>
		</div>
	</header>
	<main class="main">
		<section class="hero">
			<div class="container">
				<div class="inner">
					<h1 class="hero__title">
						<img class="hero__title-image" src="img/hero-title.png" alt="Our Blooms">
					</h1>
					<div class="hero__background">
						<div class="hero__sticker">
							<div class="hero__sticker-content">
								<p class="hero__sticker-label">New</p>
								<p class="hero__sticker-text">10% Off Your First Order</p>
								<p class="hero__sticker-note">Special</p>
							</div>
						</div>
					</div>
				</div>
			</div>
		</section>
		<section class="promo">
			<div class="container">
				<div class="promo__inner">
					<h2 class="promo__title">Who We Are</h2>
					<p class="promo__text">
						We're Our Blooms® and we're here to help you find your floral story.
					</p>
					<a class="button" href="about.html">
						About us
					</a>
				</div>
			</div>
		</section>
	</main>
</body>

</html>
